<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a24a2c"/>
      <stop offset="1" stop-color="#6e2c18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="1" stop-color="#b98a2e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- arc: tot dins del cercle segur (radi ~190 des del centre) -->
  <g fill="url(#gold)">
    <!-- àtic -->
    <rect x="156" y="132" width="200" height="26" rx="3"/>
    <rect x="170" y="158" width="172" height="20"/>
    <!-- cos de l'arc amb obertura (forat arc de mig punt) -->
    <path fill-rule="evenodd" d="M160 178 H352 V368 H160 Z
      M214 368 V272 A42 42 0 0 1 298 272 V368 Z"/>
    <!-- base -->
    <rect x="144" y="368" width="224" height="24" rx="3"/>
  </g>
  <!-- columnes laterals -->
  <g fill="#6e2c18" opacity=".35">
    <rect x="176" y="196" width="10" height="160" rx="3"/>
    <rect x="326" y="196" width="10" height="160" rx="3"/>
  </g>
  <rect x="190" y="142" width="132" height="8" fill="#6e2c18" opacity=".35"/>
</svg>
